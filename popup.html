<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FFFFFF; --bg3: #F6F2E9;
    --border: #D8D2C2;
    --accent: #B17457; --text: #4A4947; --text2: #736E66; --muted: #ABA396;
    --error: #B34C43;
    --font-display: 'Playfair Display', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { width: 280px; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 18px; }
  h1 { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 14px; display: flex; align-items: center; gap: 6px; }
  h1 span.muted { color: var(--text2); }
  h1 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-left: 1px; }
  .status { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; color: var(--text2); margin-bottom: 12px; }
  .status.connected { color: var(--accent); font-weight: 500; }
  .email { font-family: var(--font-mono); font-size: 11.5px; color: var(--text2); margin-bottom: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; }
  button { width: 100%; background: var(--accent); color: #000000; border: none; border-radius: 999px; padding: 10px; font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: #965D43; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  button.secondary:hover { background: var(--bg3); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--accent); }
  .dot.off { background: var(--error); }
</style>
</head>
<body>
  <h1>Job<span class="muted">Pilot</span><span class="dot"></span></h1>

  <div id="connected" style="display:none">
    <div class="status connected"><span class="dot on"></span>Connected</div>
    <div class="email" id="emailDisplay"></div>
    <button id="toggleOverlay" class="secondary" style="margin-bottom:10px;"></button>
    <div class="status">Click the 🎯 in the corner of any job application page to fill it — drag it anywhere on the page.</div>
  </div>

  <div id="disconnected" style="display:none">
    <div class="status"><span class="dot off"></span>Not connected</div>
    <div class="status">Sign in on the JobPilot website — the extension picks up your session automatically.</div>
    <button id="openSite">Open JobPilot</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
